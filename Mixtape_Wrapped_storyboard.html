<style>

.opt{flex:1;max-height:128px}

.rw{height:calc(var(--st)*1px - 6px)!important}

.pw{position:absolute;right:14px;top:78px;width:104px}
.pol{background:#fff;padding:6px 6px 4px;transform:rotate(8deg);box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:center}
.pol img.pi{display:block;width:92px;height:92px;object-fit:cover}
.pol span{display:block;font-size:11px;line-height:1.1;margin-top:3px;color:#0e0e0e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{color:transparent;-webkit-text-stroke:2px currentColor}
.in>.al{animation:none}
.al{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.ah{margin:0;font-weight:400;text-transform:uppercase;line-height:.9;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(38px,11.5vw,52px);transform-origin:0 0}

.ah i{font:400 .38em "Permanent Marker","Comic Sans MS",cursive;color:#ff3b1f;vertical-align:top;margin-right:.35em}
.sg{list-style:none;margin:0;padding:0;display:none}
.al.sm{gap:9px}
.al.sm .ah{font-size:22px}
.al.sm .sg{display:block;margin-top:4px}
.sg li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 14px/1 system-ui,sans-serif;padding:5px 0 5px 10px;border-left:3px solid #0e0e0e}
.sg li b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg li span{font-size:12px;opacity:.7;flex:none}
.arc{fill:none;stroke-width:15;stroke-dasharray:var(--p) 100;animation:arc 1.3s cubic-bezier(.3,1,.4,1) both;animation-delay:calc(.4s + var(--k)*.16s)}
@keyframes arc{from{stroke-dasharray:0 100}}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.lg li{display:flex;gap:10px;align-items:center;font-size:20px;text-transform:uppercase;line-height:1}
.lg i{width:16px;height:16px;border:2px solid #0e0e0e;flex:none}
.lg span{margin-left:auto;font:700 14px system-ui,sans-serif}
.slow{animation:sp 16s linear infinite;transform-box:fill-box;transform-origin:center}
.hand{transition:transform 1.8s .5s cubic-bezier(.3,1.4,.5,1);transform-origin:150px 150px}
.bdg{position:absolute;right:8px;top:178px;width:170px;transform:rotate(12deg);pointer-events:none}
#tb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:20;display:flex;gap:6px}
#ld,#pp{font:700 14px system-ui,sans-serif;padding:8px 14px;border-radius:99px;border:2px solid var(--ink);background:var(--yel);color:var(--ink);cursor:pointer}
#pn{position:fixed;inset:0;z-index:19;background:var(--pn);color:var(--ink);display:none;flex-direction:column;gap:14px;padding:64px 20px 20px;box-sizing:border-box;font:16px/1.4 system-ui,sans-serif}
#pn.open{display:flex}

#pn .go{background:var(--grn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #pn{color:#eee}}
@media (prefers-reduced-motion:reduce){*,#stage::after{animation:none!important;transition:none!important}.dd{stroke-dashoffset:0}}
#pp{background:var(--paper)}
#stage{-webkit-user-select:none;user-select:none}
#tl,#tr{-webkit-touch-callout:none;touch-action:manipulation}
.chap{position:absolute;top:24px;left:24px;font-size:14px;letter-spacing:.03em;opacity:.7}

.in>.fx{animation:none}
.fx svg{position:absolute;animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r0))}50%{transform:translateY(-22px) rotate(calc(var(--r0) + 14deg))}}

</style>
</head>
<body>
<div id="tb">
  <span id="badge" title="Active Mixtape Persona & Year (Click to change)" style="font:700 13px system-ui,sans-serif;padding:7px 12px;border-radius:99px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer">
    <i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);animation:beat 1.2s infinite alternate"></i>
    <span id="badge-text">user_real_01 · 2026</span>
  </span>
  <button id="pp" type="button" aria-pressed="false">&#10074;&#10074; Pause</button>
  <button id="ld" type="button">Mixtape Vault</button>
</div>
<div id="pn">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <h2 style="margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:.02em">MIXTAPE VAULT</h2>
    <button id="cl" type="button" style="padding:6px 14px!important;font-size:14px!important">✕ Close</button>
  </div>
  
  <div id="vault" style="background:#e8e6df;color:#0e0e0e;padding:16px;border:3px solid #0e0e0e;border-radius:8px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="mk" style="font-size:20px;color:#ff3b1f">LAKEHOUSE GOLD MIXTAPES</span>
      <span style="font:700 11px system-ui,sans-serif;background:#0e0e0e;color:#ffe14a;padding:3px 8px;border-radius:4px;letter-spacing:0.5px">LIVE PIPELINE</span>
    </div>
    <p style="font-size:13px;margin:0;line-height:1.3;font-weight:600">Choose any listener persona and year from the Gold Medallion layer to run their personalized Wrapped experience:</p>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px">
      <div>
        <label for="u-sel" style="display:block;font:700 11px system-ui,sans-serif;margin-bottom:3px;text-transform:uppercase">Listener Persona</label>
        <select id="u-sel" style="width:100%;padding:9px;font:700 14px system-ui,sans-serif;border:2px solid #0e0e0e;border-radius:6px;background:#fff;color:#0e0e0e;box-sizing:border-box"></select>
      </div>
      <div>
        <label for="y-sel" style="display:block;font:700 11px system-ui,sans-serif;margin-bottom:3px;text-transform:uppercase">Year</label>
        <select id="y-sel" style="width:100%;padding:9px;font:700 14px system-ui,sans-serif;border:2px solid #0e0e0e;border-radius:6px;background:#fff;color:#0e0e0e;box-sizing:border-box"></select>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap">
      <button id="btn-play-tape" class="go" type="button" style="background:var(--grn);font-weight:700;padding:10px 18px;border:2px solid #0e0e0e;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px"><span>&#9654;</span> PLAY THIS TAPE</button>
      <span id="tape-info" style="font-size:12px;font-weight:700;opacity:.8"></span>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin:2px 0"><hr style="flex:1;border:0;border-top:2px dashed rgba(0,0,0,0.2)"><span style="font-size:12px;font-weight:700;opacity:0.6">OR LOAD RAW EXPORTS</span><hr style="flex:1;border:0;border-top:2px dashed rgba(0,0,0,0.2)"></div>

  <p style="font-size:13px;margin:0">Drop raw Spotify <code>Streaming_History_Audio_*.json</code> files to calculate client-side:</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <label>Choose files<input id="fi" type="file" multiple accept=".json" hidden></label>
    <button class="go" id="sm" type="button">Use sample data</button>
  </div>
  <p id="ms" role="status"></p>
</div>
<main id="stage" aria-live="polite">
  <div id="bars"></div>
  <button id="tl" type="button" aria-label="Previous slide"></button>
  <button id="tr" type="button" aria-label="Next slide"></button>
</main>
<script>
var M=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(){
  var A=[["Arctic Monkeys",812],["Hasan Raheem",690],["Tame Impala",644],["Talha Anjum",521],["Radiohead",477]],r=rng(7);
  var hr=M.concat(M).map(function(_,h){var d=Math.min(Math.abs(h-23),24-Math.abs(h-23));return Math.round(40+260*Math.exp(-d*d/18)+r()*30)});

  if(window.WRAPPED_CATALOG&&window.WRAPPED_CATALOG[uid]&&window.WRAPPED_CATALOG[uid][yr]){
    try{history.replaceState(null,"","#user="+uid+"&year="+yr)}catch(e){}
    restart(window.WRAPPED_CATALOG[uid][yr],uid,yr);
    return true;
  }
  return false;
}
function initVault(){
  var uSel=document.getElementById("u-sel"),ySel=document.getElementById("y-sel"),info=document.getElementById("tape-info"),playBtn=document.getElementById("btn-play-tape");
  if(!uSel||!ySel)return;
  var users=window.WRAPPED_USERS||[];
  if(!users.length&&window.WRAPPED_CATALOG){
    users=Object.keys(window.WRAPPED_CATALOG).map(function(k){
      return{user_id:k,is_real:k.indexOf("real")>-1,label:k,years:Object.keys(window.WRAPPED_CATALOG[k]).map(Number).sort()};
    });
  }
  if(!users.length){
    uSel.innerHTML='<option value="'+(typeof ACTIVE_USER!=="undefined"?ACTIVE_USER:"user_real_01")+'">'+(typeof ACTIVE_USER!=="undefined"?ACTIVE_USER:"user_real_01")+'</option>';
    ySel.innerHTML='<option value="'+(typeof ACTIVE_YEAR!=="undefined"?ACTIVE_YEAR:2026)+'">'+(typeof ACTIVE_YEAR!=="undefined"?ACTIVE_YEAR:2026)+'</option>';
    return;
  }
  var rGrp=document.createElement("optgroup"),sGrp=document.createElement("optgroup");
  rGrp.label="Real Listeners (Extended History)";
  sGrp.label="Synthetic Personas (Calibrated Clusters)";
  users.forEach(function(u){
    var opt=document.createElement("option");
    opt.value=u.user_id;
    opt.textContent=u.label||u.user_id;
    if(typeof ACTIVE_USER!=="undefined"&&u.user_id===ACTIVE_USER)opt.selected=true;
    (u.is_real?rGrp:sGrp).appendChild(opt);
  });
  uSel.innerHTML="";
  if(rGrp.children.length)uSel.appendChild(rGrp);
  if(sGrp.children.length)uSel.appendChild(sGrp);

  function syncYears(){
    var uid=uSel.value,uObj=users.find(function(x){return x.user_id===uid}),yrs=(uObj&&uObj.years)||[2026];
    var curActiveYr=typeof ACTIVE_YEAR!=="undefined"?ACTIVE_YEAR:2026;
    ySel.innerHTML=yrs.map(function(y){return '<option value="'+y+'" '+(y===curActiveYr?"selected":"")+'>'+y+'</option>'}).join("");
    updateInfo();
  }
  function updateInfo(){
    if(!info)return;
    var uid=uSel.value,curYr=+ySel.value;
    if(window.WRAPPED_CATALOG&&window.WRAPPED_CATALOG[uid]&&window.WRAPPED_CATALOG[uid][curYr]){
      var p=window.WRAPPED_CATALOG[uid][curYr];
      info.textContent=Number(p.minutes).toLocaleString("en-US")+" min · Top: "+((p.artists&&p.artists[0]&&p.artists[0].name)||"");
    }else{
      info.textContent="";
    }
  }
  uSel.onchange=syncYears;
  ySel.onchange=updateInfo;
  syncYears();

  if(playBtn){
    playBtn.onclick=function(){
      var uid=uSel.value,yr=+ySel.value;
      if(!loadUserYear(uid,yr)){
        alert("Could not load mixtape for "+uid+" ("+yr+").");
      }
    };
  }
}

var badgeEl=document.getElementById("badge");
if(badgeEl)badgeEl.onclick=function(){ms.textContent="";pn.classList.add("open")};
document.getElementById("ld").onclick=function(){ms.textContent="";pn.classList.add("open")};
document.getElementById("cl").onclick=function(){pn.classList.remove("open")};
document.getElementById("sm").onclick=function(){restart(sample(),"Sample",2026)};
document.getElementById("fi").onchange=function(e){
  var fs=[].slice.call(e.target.files);if(!fs.length)return;ms.textContent="Reading "+fs.length+" file(s)...";
  Promise.all(fs.map(function(f){return f.text().then(function(t){try{var j=JSON.parse(t);return Array.isArray(j)?j:[]}catch(x){return[]}})})).then(function(a){
    var d=fromHistory([].concat.apply([],a));
    if(!d||d.artists.length<2||d.tracks.length<2){ms.textContent="No usable plays found. Pick the Streaming_History_Audio files (JSON).";return}
    restart(d,"Custom",d.year||2026)})};

// Initial URL parameter check or default load
var initParams=getParams();
if(initParams.user&&initParams.year&&window.WRAPPED_CATALOG&&window.WRAPPED_CATALOG[initParams.user]&&window.WRAPPED_CATALOG[initParams.user][+initParams.year]){
  ACTIVE_USER=initParams.user;
  ACTIVE_YEAR=+initParams.year;
  D=window.WRAPPED_CATALOG[ACTIVE_USER][ACTIVE_YEAR];
}
updateBadge();
initVault();
build();show(0);requestAnimationFrame(frame);
</script>
